# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "nba2k27"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI invokes `npx wrangler deploy` directly. Build Astro first so
# the static-assets directory exists before Wrangler validates it.
[build]
command = "npm run build"

# Serve on *.workers.dev until you attach a real zone in the dashboard
# (Workers & Pages → nba2k27 → Settings → Domains & Routes).
# Do not put localhost or unproxied hostnames in [[routes]] — deploy will fail.
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
